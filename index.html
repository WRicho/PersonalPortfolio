<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WRicho — Mechanical &amp; Mechatronics Engineering</title>
  <meta name="description" content="Portfolio of WRicho: mechanical and mechatronics engineering projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#projects">Skip to projects</a>

<header class="site-nav">
    <a class="brand" href="index.html">WRicho</a>
    <nav class="nav-links" aria-label="Main">
      <a class="nav-link" href="index.html#projects">Projects</a>
      <a class="nav-link" href="about/index.html">About</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-head">
        <span class="eyebrow">Featured work</span>
        <h1 id="hero-title"></h1>
        <p id="hero-intro"></p>
      </div>

      <div class="carousel" id="carousel" role="region" aria-roledescription="carousel" aria-label="Featured projects" hidden>
        <div class="carousel-track" id="track"></div>
        <div class="carousel-controls">
          <button class="icon-btn" id="prev" type="button" aria-label="Previous project">&#8249;</button>
          <div class="dots" id="dots"></div>
          <button class="icon-btn" id="next" type="button" aria-label="Next project">&#8250;</button>
          <button class="text-btn" id="toggle" type="button">Pause</button>
        </div>
      </div>
    </section>

    <section class="projects" id="projects" aria-labelledby="projects-title">
      <div class="wrap">
        <div class="projects-head">
          <h2 id="projects-title">All projects</h2>
          <label class="search">
            <span class="visually-hidden">Search projects</span>
            <input type="search" id="search" placeholder="Search projects" autocomplete="off">
          </label>
        </div>
        <p class="result-count" id="count" aria-live="polite"></p>

        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" id="footer-links" aria-label="Contact"></nav>
    <p>&copy; <span id="year"></span> WRicho</p>
  </footer>

  <!-- Data first, then the code that renders it -->
  <script src="data/site.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
