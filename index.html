<head>

</head>
<body>

    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-head">
        <span class="eyebrow">Featured work</span>
        <h1 id="hero-title"></h1>
        <p id="hero-intro"></p>
      </div>

      <div class="carousel" id="carousel" role="region" aria-roledescription="carousel" aria-label="Featured projects" hidden>
        <div class="carousel-track" id="track"></div>
        <div class="carousel-controls">
          <button class="icon-btn" id="prev" type="button" aria-label="Previous project">&#8249;</button>
          <div class="dots" id="dots"></div>
          <button class="icon-btn" id="next" type="button" aria-label="Next project">&#8250;</button>
          <button class="text-btn" id="toggle" type="button">Pause</button>
        </div>
      </div>
    </section>

    <section class="projects" id="projects" aria-labelledby="projects-title">
      <div class="wrap">
        <div class="projects-head">
          <h2 id="projects-title">All projects</h2>
          <div class="head-tools">
            <label class="sort">
              <span class="visually-hidden">Sort projects</span>
              <select id="sort">
                <option value="newest">Sort: Newest first</option>
                <option value="oldest">Sort: Oldest first</option>
                <option value="az">Sort: A to Z</option>
                <option value="za">Sort: Z to A</option>
              </select>
            </label>
            <label class="search">
              <span class="visually-hidden">Search projects</span>
              <input type="search" id="search" placeholder="Search projects" autocomplete="off">
            </label>
          </div>
        </div>

        <div class="tags" id="tags" role="group" aria-label="Filter by keyword"></div>
        <p class="result-count" id="count" aria-live="polite"></p>

        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" id="footer-links" aria-label="Contact"></nav>
    <p>&copy; <span id="year"></span> WRicho</p>
  </footer>

  <!-- Data first, then the code that renders it -->
  <script src="data/site.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
